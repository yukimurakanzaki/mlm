name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: 24.x
      - name: Build Next.js
        run: npm run build-local
        env:
          NEXT_PUBLIC_SENTRY_DISABLED: 'true'
          NEXT_PUBLIC_APP_URL: http://localhost:3008

  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Needed to verify commit messages
      - name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: 24.x
      - if: github.event_name == 'pull_request'
        name: Validate commit messages
        run: npx commitlint --from $BASE_SHA --to $HEAD_SHA --verbose
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - name: Lint
        run: npx next typegen && npm run lint
      - name: Type check
        run: npm run check:types
      - name: Unused code and dependencies
        run: npm run check:deps
      - name: I18n keys
        run: npm run check:i18n

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: 24.x
      - name: Run unit tests
        uses: docker://mcr.microsoft.com/playwright:v1.61.0
        with:
          args: npm run test

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build]
    steps:
      - uses: actions/checkout@v6
      - name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: 24.x
      - name: Run E2E tests
        uses: docker://mcr.microsoft.com/playwright:v1.61.0
        with:
          args: sh -c "npm run build-local && HOME=/root npm run test:e2e"
        env:
          NEXT_PUBLIC_SENTRY_DISABLED: 'true'
      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 7
